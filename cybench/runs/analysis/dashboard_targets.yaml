# Dashboard publish pipeline — paths only (anunna / lustre).
#
# Paper GitHub Pages (do not overwrite while the paper is under review):
#   WUR-AI/AgML-CY-Bench-dashboard
#   https://wur-ai.github.io/AgML-CY-Bench-dashboard/
#
# In-review / extra models (EXAONE, …) go to the personal clone instead:
#   poetry run python cybench/runs/analysis/orchestrate_dashboard_publish.py \
#       --destination personal --mode ready --stages publish,index --commit --push
#   → https://michielkallenberg.github.io/CY-Bench-dashboard/
#   git clone (anunna, if missing):
#     git clone git@github.com:michielkallenberg/CY-Bench-dashboard.git \
#       /lustre/backup/SHARED/AIN/agml/CY-Bench-dashboard-personal
#   `--push` to the paper remote is blocked unless you pass --allow-official-push.
#
# Targets are discovered from:
#   {output_root}/baselines_{CC}_{eos|mid|qtr}_v{N}/   (per-country SLURM batches)
# and, when present, walk-forward runs under:
#   {output_root}/baselines/   (legacy/default Hydra experiment.name)
#
# New countries appear when you submit SLURM batches; no edit needed here.
# Optional: uncomment ``include`` to pin a subset (also used by --mode planned).

defaults:
  version: 4
  output_root: /lustre/backup/SHARED/AIN/agml/output
  repo_root: /lustre/backup/SHARED/AIN/agml/AgML-CY-Bench-AAAI
  publish_root: /lustre/backup/SHARED/AIN/agml/AgML-CY-Bench-dashboard
  min_run_fraction: 1.0

# include:
#   - country: DE
#     horizons: [eos, mid_season]
